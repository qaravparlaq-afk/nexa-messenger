name: NEXA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Check Rust workspace
        run: cargo check --manifest-path core/Cargo.toml --workspace --all-targets
      - name: Test Rust workspace
        run: cargo test --manifest-path core/Cargo.toml --workspace --all-targets

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Check gateway
        run: cargo check --manifest-path backend/Cargo.toml --all-targets
      - name: Test gateway
        run: cargo test --manifest-path backend/Cargo.toml --all-targets
