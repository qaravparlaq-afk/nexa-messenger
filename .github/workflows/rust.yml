name: Rust Core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        working-directory: core
        run: cargo check --workspace --all-targets
      - name: Run tests
        working-directory: core
        run: cargo test --workspace --all-targets
