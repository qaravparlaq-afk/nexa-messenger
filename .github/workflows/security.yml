name: NEXA Security Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexa-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Reject obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|seed phrase|mnemonic|xprv|-----BEGIN'               . --exclude-dir=.git --exclude-dir=target               --exclude='*.md' --exclude='security.yml'; then
            echo "Potential secret material found."
            exit 1
          fi

  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile
        working-directory: core
        run: cargo generate-lockfile
      - name: Audit dependencies
        uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: core
          createIssues: false
