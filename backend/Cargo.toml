[package]
name = "nexa-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
ed25519-dalek = "2"
futures-util = "0.3"
nexa-protocol = { path = "../core/protocol" }
nexa-transport = { path = "../core/transport" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
