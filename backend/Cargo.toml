[package]
name = "nexa-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
ed25519-dalek = "2"
nexa-protocol = { path = "../core/protocol" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
