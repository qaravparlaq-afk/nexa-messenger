[package]
name = "nexa-envelope"
version = "0.1.0"
edition = "2021"

[dependencies]
nexa-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

[dev-dependencies]
nexa-identity = { path = "../identity" }
nexa-ratchet = { path = "../ratchet" }
nexa-session = { path = "../session" }
