[package]
name = "nexa-session"
version = "0.1.0"
edition = "2021"

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
nexa-identity = { path = "../identity" }
nexa-protocol = { path = "../protocol" }
